services:
  # Backend Service
  - type: web
    name: student-management-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_HOST
        sync: false # Set this in Render dashboard
      - key: DB_USER
        sync: false # Set this in Render dashboard
      - key: DB_PASSWORD
        sync: false # Set this in Render dashboard
      - key: DB_NAME
        sync: false # Set this in Render dashboard
      - key: JWT_SECRET
        sync: false # Set this in Render dashboard

  # Frontend Service
  - type: static
    name: student-management-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: student-management-backend
          property: url
